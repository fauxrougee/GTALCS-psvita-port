name: PS Vita

on:
  push:
    paths: ['src/**', 'vendor/**', 'vita/**', 'tools/vita/**', '.github/workflows/vita.yml']
  pull_request:
    paths: ['src/**', 'vendor/**', 'vita/**', 'tools/vita/**', '.github/workflows/vita.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check the librw patch in standalone and nested source folders
        run: python3 tools/vita/check-librw-patch.py
      - name: Apply the reviewed librw patch
        run: git apply --directory=vendor/librw vita/librw-psp2.patch
      - name: Check accounting, renderer values and asynchronous logging
        run: |
          python3 tools/vita/check-perf-stats.py
          python3 tools/vita/check-perf-hooks.py
          python3 tools/vita/check-render-cache.py
          python3 tools/vita/check-render-state.py
          python3 tools/vita/check-async-log.py
      - name: Check Vita save paths and failure reporting
        run: python3 tools/vita/check-save-paths.py
      - name: Check Vita input and saved control bindings
        run: python3 tools/vita/check-vita-controls.py
      - name: Check updater policy, extraction and failed transfers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libcurl4-openssl-dev libssl-dev
          python3 tools/vita/check-updater.py
          python3 tools/vita/check-update-network.py
          python3 tools/vita/check-update-launch.py
          python3 tools/vita/check-vita-cheats.py
      - name: Check the benchmark metrics and report tool
        run: |
          python3 tools/vita/check-bench-metrics.py
          python3 tools/vita/check-bench-report.py

  build-vita:
    needs: host-tests
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:2026.08-20260815
    timeout-minutes: 30
    env:
      VDPM_NONINTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host and target dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv ffmpeg ninja-build git build-essential zlib1g-dev
          vdpm install zlib taihen kubridge libmathneon vitaShaRK SceShaccCgExt vitaGL openal-soft mpg123 curl-mbedtls mbedtls zstd
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/vita/requirements.txt
      - name: Build full intro release
        run: .venv/bin/python tools/vita/build.py --jobs 2
      - name: Validate every movie frame and malformed files
        run: .venv/bin/python tools/vita/check-software-movie.py
      - name: Extract the complete VPK through the production updater
        run: .venv/bin/python tools/vita/check-updater.py --vpk build/vita-intro/reLCS.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: reLCS-PSVita-intro
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  build-vita-bench:
    needs: host-tests
    runs-on: ubuntu-24.04
    container: vitasdk/vitasdk:2026.08-20260815
    timeout-minutes: 30
    env:
      VDPM_NONINTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host and target dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv ninja-build git build-essential
          vdpm install zlib taihen kubridge libmathneon vitaShaRK SceShaccCgExt vitaGL openal-soft mpg123
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/vita/requirements.txt
      - name: Build the reLCS Benchmark app
        run: .venv/bin/python tools/vita/build.py --benchmark --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: reLCS-PSVita-benchmark
          path: dist/*benchmark*
          if-no-files-found: error
          compression-level: 0
